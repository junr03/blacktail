name: Public checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: cachix/install-nix-action@v31
      - name: Check the public flake without private access
        run: |
          test ! -f private-config/default.nix
          nix flake check --all-systems
          test "$(nix eval --json .#darwinConfigurations --apply builtins.attrNames)" = '[]'
      - name: Check missing-private-config diagnostics
        run: python3 tests/test_build_helpers.py
