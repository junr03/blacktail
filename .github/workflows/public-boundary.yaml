name: Public boundary

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Fetch candidate commit as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Invalid pull request number" >&2; exit 2 ;;
          esac
          if [[ ! "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request commit" >&2
            exit 2
          fi
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_SHA"
      - name: Reject private paths and credential material from candidate history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_public.py --range "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Test the trusted boundary checker
        run: python3 -m unittest tests/test_public_boundary.py
