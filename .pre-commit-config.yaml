default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: public-boundary-commit
        name: Protect public/private boundary in commit
        entry: python3 scripts/check_public.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: nixfmt
        name: Format Nix files with nixfmt
        entry: nixfmt
        language: system
        files: '\.nix$'
      - id: shellcheck
        name: Lint shell scripts with ShellCheck
        entry: shellcheck
        language: system
        files: '^apps/'
        types: [shell]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
